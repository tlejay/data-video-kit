<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--leaf:#C7F0D9;--lav:#E7DEFE;--pink:#FAD7E0;--deep:#5BAA80;--ink:#2A2A30;--bg:#FBFAF6;--wm:#7A7F86}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);font-family:'Noto Sans Thai',sans-serif;color:var(--ink)}
#stage{position:absolute;inset:0;overflow:hidden}
.abs{position:absolute;left:0;right:0;text-align:center}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:.75}
#grain{position:absolute;inset:0;background-image:radial-gradient(rgba(42,42,48,.05) 1px,transparent 1px);background-size:6px 6px}
.chip{display:inline-block;padding:14px 34px;border-radius:999px;font-weight:800;font-size:44px;border:4px solid var(--ink);background:#fff;margin:0 8px}
.big{font-weight:900;letter-spacing:-4px;line-height:.9}
.num{font-family:'Space Grotesk',sans-serif;font-weight:700}
#bars{position:absolute;left:90px;right:90px;top:820px;height:380px;display:flex;align-items:center;justify-content:space-between}
#bars i{display:block;width:14px;border-radius:7px;background:var(--ink)}
#cap{position:absolute;left:70px;right:70px;top:1290px;text-align:center;font-weight:800;font-size:86px;line-height:1.25}
#nar{position:absolute;left:60px;right:60px;top:1590px;text-align:center}
#nar span{display:inline-block;background:var(--ink);color:#fff;font-weight:600;font-size:46px;line-height:1.35;padding:14px 34px;border-radius:28px}
#wm{position:absolute;right:48px;bottom:44px;font-size:30px;color:var(--wm);font-weight:600}
#prog{position:absolute;left:90px;right:90px;top:1240px;height:10px;border-radius:5px;background:rgba(42,42,48,.12);overflow:hidden}
#prog b{display:block;height:100%;width:0;background:var(--ink)}
#flash{position:absolute;inset:0;background:var(--ink);opacity:0}
#av{position:absolute;left:50%;top:330px;width:520px;height:520px;margin-left:-260px;border-radius:50%;overflow:hidden;border:10px solid #fff;box-shadow:0 30px 80px rgba(91,170,128,.35)}
#av img{width:100%;height:100%;object-fit:cover}
#ring{position:absolute;left:50%;top:330px;width:520px;height:520px;margin-left:-260px;border-radius:50%;border:6px solid var(--deep)}
#card{position:absolute;left:80px;right:80px;top:330px;background:#fff;border:5px solid var(--ink);border-radius:48px;padding:56px 60px;box-shadow:16px 16px 0 var(--ink)}
#card h2{font-family:'Space Grotesk',sans-serif;font-size:64px;margin-bottom:26px;line-height:1.1}
#card h2 small{display:block;font-family:'Noto Sans Thai';font-size:36px;font-weight:600;color:var(--wm);margin-top:8px}
.row{display:flex;justify-content:space-between;align-items:center;padding:22px 0;border-top:3px dashed rgba(42,42,48,.18);font-size:46px}
.row .k{font-weight:600;color:#55575f}
.row .v{font-family:'Space Grotesk','Noto Sans Thai';font-weight:700;font-size:52px}
.tag{display:inline-block;font-size:38px;padding:6px 20px;border-radius:999px;border:3px solid var(--ink);margin-left:10px}
